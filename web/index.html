    <meta name="theme-color" content="#111111" />
    <script>
      (() => {
        let choice;
        try { choice = localStorage.getItem("btt-theme"); } catch {}
        document.documentElement.dataset.theme = choice === "blue" || choice === "light"
          ? choice : "dark";
      })();
    </script>
